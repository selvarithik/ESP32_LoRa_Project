<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Industrial IoT Gateway — ESP32, LoRa, Arduino UNO and Raspberry Pi</title>
  <desc id="desc">Dark navy technical illustration showing ESP32, EBYTE LoRa, Arduino UNO and Raspberry Pi boards connected by wireless signal lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081321"/>
      <stop offset=".55" stop-color="#10263B"/>
      <stop offset="1" stop-color="#07111D"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28485F"/>
      <stop offset="1" stop-color="#152C40"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8B5C1"/>
      <stop offset=".45" stop-color="#647684"/>
      <stop offset="1" stop-color="#263845"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E6370"/>
      <stop offset="1" stop-color="#15202A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02070D" flood-opacity=".42"/>
    </filter>
    <filter id="glowBlue" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7EA0BA" stroke-opacity=".10"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- subtle technical lines -->
  <g fill="none" stroke="#56B9E8" stroke-opacity=".18">
    <path d="M60 180H430M80 205H350M830 120H1140"/>
    <path d="M60 700H360M860 760H1160"/>
    <path d="M160 90V270M1040 80V280"/>
  </g>

  <!-- wireless arcs -->
  <g fill="none" stroke="#56C3F3" stroke-linecap="round" filter="url(#glowBlue)">
    <path d="M760 170c-95 0-173 78-173 173" stroke-width="4" opacity=".8"/>
    <path d="M760 170c-155 0-281 126-281 281" stroke-width="3" opacity=".56"/>
    <path d="M760 170c-213 0-386 173-386 386" stroke-width="2" opacity=".32"/>
  </g>
  <g fill="#7FD5FA" filter="url(#glowBlue)">
    <circle cx="760" cy="170" r="6"/>
    <circle cx="587" cy="343" r="5"/>
    <circle cx="479" cy="451" r="4"/>
  </g>

  <!-- antenna -->
  <g transform="translate(795 68)">
    <rect x="0" y="52" width="12" height="194" rx="6" fill="#111A22"/>
    <rect x="3" y="0" width="6" height="58" rx="3" fill="#313E49"/>
    <circle cx="6" cy="8" r="5" fill="#F0A45B" filter="url(#glowAmber)"/>
    <rect x="-8" y="239" width="28" height="9" rx="4.5" fill="#1C2D3A"/>
  </g>

  <!-- EBYTE LoRa module -->
  <g transform="translate(694 345)" filter="url(#shadow)">
    <rect width="318" height="188" rx="20" fill="url(#board)" stroke="#3A6D8C" stroke-width="2"/>
    <rect x="18" y="18" width="282" height="152" rx="14" fill="#0D1B28" stroke="#355B72"/>
    <rect x="92" y="40" width="155" height="78" rx="10" fill="url(#metal)" stroke="#BBC6CD"/>
    <text x="170" y="74" fill="#17212A" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">EBYTE</text>
    <text x="170" y="98" fill="#253744" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">LoRa E32</text>
    <g fill="#A7D7ED">
      <rect x="28" y="27" width="7" height="128" rx="3"/>
      <rect x="48" y="27" width="7" height="128" rx="3"/>
      <rect x="268" y="27" width="7" height="128" rx="3"/>
      <rect x="288" y="27" width="7" height="128" rx="3"/>
    </g>
    <circle cx="44" cy="38" r="5" fill="#5BC1EC" filter="url(#glowBlue)"/>
    <circle cx="62" cy="38" r="5" fill="#F1AA58" filter="url(#glowAmber)"/>
    <path d="M252 22L315 -18" stroke="#D39A55" stroke-width="5"/>
    <circle cx="316" cy="-18" r="7" fill="#D39A55"/>
  </g>

  <!-- ESP32 board -->
  <g transform="translate(300 435) rotate(-4)" filter="url(#shadow)">
    <rect width="380" height="208" rx="22" fill="url(#board)" stroke="#3E6B84" stroke-width="2"/>
    <rect x="28" y="30" width="324" height="150" rx="13" fill="#0B1721" stroke="#335A70"/>
    <rect x="121" y="50" width="150" height="76" rx="10" fill="url(#metal)" stroke="#BBC6CD"/>
    <text x="196" y="80" fill="#1A2732" font-family="Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">ESP32</text>
    <text x="196" y="101" fill="#314655" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Wi‑Fi / BLE</text>
    <g fill="#A9D7EC">
      <rect x="38" y="23" width="7" height="166" rx="3"/>
      <rect x="56" y="23" width="7" height="166" rx="3"/>
      <rect x="317" y="23" width="7" height="166" rx="3"/>
      <rect x="335" y="23" width="7" height="166" rx="3"/>
    </g>
    <rect x="85" y="144" width="52" height="20" rx="5" fill="#233946"/>
    <circle cx="150" cy="154" r="6" fill="#47B9EA" filter="url(#glowBlue)"/>
    <circle cx="171" cy="154" r="6" fill="#F3A65A" filter="url(#glowAmber)"/>
    <path d="M380 116h25v38h-25z" fill="#C7D0D7"/>
    <path d="M380 171h25v18h-25z" fill="#AAB6BF"/>
  </g>

  <!-- Arduino UNO -->
  <g transform="translate(86 632)" filter="url(#shadow)">
    <rect width="370" height="188" rx="22" fill="#1A5C56" stroke="#65A69B" stroke-width="2"/>
    <rect x="24" y="28" width="322" height="130" rx="12" fill="#2C6E67" opacity=".82"/>
    <rect x="108" y="56" width="132" height="56" rx="8" fill="#22343B"/>
    <text x="174" y="88" fill="#D8E3E9" font-family="Arial, sans-serif" font-size="19" font-weight="800" text-anchor="middle">UNO</text>
    <text x="174" y="108" fill="#B5C5CD" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Arduino</text>
    <rect x="44" y="49" width="24" height="72" rx="4" fill="#D1D9DE"/>
    <rect x="302" y="47" width="24" height="74" rx="4" fill="#D1D9DE"/>
    <circle cx="82" cy="126" r="6" fill="#5BC1EC" filter="url(#glowBlue)"/>
    <circle cx="98" cy="126" r="6" fill="#F2A25A" filter="url(#glowAmber)"/>
  </g>

  <!-- Raspberry Pi -->
  <g transform="translate(672 612)" filter="url(#shadow)">
    <rect width="380" height="218" rx="22" fill="#3F7B65" stroke="#79AF9A" stroke-width="2"/>
    <rect x="26" y="27" width="328" height="162" rx="13" fill="#3B8A6D"/>
    <rect x="105" y="58" width="122" height="66" rx="9" fill="#253238"/>
    <text x="166" y="88" fill="#E0E9ED" font-family="Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle">Raspberry Pi</text>
    <text x="166" y="108" fill="#BAC8CE" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">SBC / Linux</text>
    <g fill="#D0D9DD">
      <rect x="269" y="45" width="56" height="35" rx="5"/>
      <rect x="269" y="92" width="56" height="35" rx="5"/>
      <rect x="42" y="48" width="45" height="80" rx="5"/>
    </g>
    <circle cx="78" cy="151" r="6" fill="#F2A25A" filter="url(#glowAmber)"/>
    <circle cx="96" cy="151" r="6" fill="#5BC1EC" filter="url(#glowBlue)"/>
  </g>

  <!-- connection lines -->
  <g fill="none" stroke="#6CBEDC" stroke-width="2" opacity=".65">
    <path d="M492 537C560 500 625 466 694 441"/>
    <path d="M454 690C560 632 638 570 735 522"/>
    <path d="M690 715C630 672 586 636 532 617"/>
  </g>

  <!-- labels -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(730 300)">
      <rect width="174" height="42" rx="11" fill="#0E2437" stroke="#4EAFD2"/>
      <circle cx="19" cy="21" r="7" fill="#59C2ED"/>
      <text x="36" y="25" fill="#F0F7FB" font-size="14" font-weight="800">EBYTE LoRa</text>
    </g>

    <g transform="translate(334 392)">
      <rect width="126" height="42" rx="11" fill="#0E2437" stroke="#4EAFD2"/>
      <circle cx="18" cy="21" r="7" fill="#59C2ED"/>
      <text x="35" y="25" fill="#F0F7FB" font-size="14" font-weight="800">ESP32</text>
    </g>

    <g transform="translate(94 586)">
      <rect width="156" height="42" rx="11" fill="#12382F" stroke="#7BBDA8"/>
      <circle cx="18" cy="21" r="7" fill="#7BBDA8"/>
      <text x="35" y="25" fill="#F0F7FB" font-size="14" font-weight="800">Arduino UNO</text>
    </g>

    <g transform="translate(772 566)">
      <rect width="178" height="42" rx="11" fill="#14392F" stroke="#7DB8A2"/>
      <circle cx="18" cy="21" r="7" fill="#7DB8A2"/>
      <text x="35" y="25" fill="#F0F7FB" font-size="14" font-weight="800">Raspberry Pi</text>
    </g>
  </g>

  <!-- decorative node points -->
  <g fill="#68C3E8">
    <circle cx="190" cy="274" r="3"/>
    <circle cx="1060" cy="314" r="4"/>
    <circle cx="252" cy="548" r="3"/>
    <circle cx="1104" cy="640" r="3"/>
  </g>
</svg>
