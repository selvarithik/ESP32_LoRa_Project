<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future sensor icons · SELVARITHIK A&D</title><style>body{font:14px Arial;color:#14283d;background:#f7f8fa;margin:0}header{background:#ff0000;color:white;padding:24px}main{padding:24px;max-width:960px;margin:auto}h1{font-size:23px}p{color:#617080;line-height:1.6}.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}article{background:white;border:1px solid #dde3e8;border-radius:9px;padding:20px 12px;text-align:center}svg{width:34px;height:34px;fill:none;stroke:#c60000;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}strong,small{display:block;margin-top:12px}small{color:#617080;font-size:11px}@media(max-width:600px){.icons{grid-template-columns:repeat(2,1fr)}}</style><header><b>SELVARITHIK A&D</b> · Sensor Management</header><main><h1>10 new sensor icon choices</h1><p>Display icons for future sensors. Adding an icon does not install a driver or generate readings.</p><div class="icons" id="icons"></div></main><script>window.gateway={escape:s=>String(s)};</script><script src="../dashboard/static/js/sensor-widgets.js"></script><script>for(const [key,label] of [['fan','Airflow'],['flame','Flame'],['cloud-rain','Rain'],['magnet','Magnetic field'],['door','Door contact'],['weight','Load / weight'],['ruler','Distance'],['volume','Sound level'],['compass','Heading'],['beaker','Liquid chemistry']]){const a=document.createElement('article');a.innerHTML=SensorUI.icon({widget_config:{icon:key}});const b=document.createElement('strong');b.textContent=label;const c=document.createElement('small');c.textContent=key;a.append(b,c);document.getElementById('icons').append(a);}</script></html>
